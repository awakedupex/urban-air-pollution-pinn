# Frozen experimental configuration (architecture approved 2026-11-01).
# Every script reads this file; change values here, never inline.

seed: 42

domain:
  name: Delhi NCT
  # Local tangent-plane projection origin (degrees). x = east (km), y = north (km).
  lat0: 28.63
  lon0: 77.15
  # Bounding box used to select monitoring stations (degrees).
  lat_min: 28.40
  lat_max: 28.88
  lon_min: 76.84
  lon_max: 77.35

windows:
  # Two 10-day study windows (local time, Asia/Kolkata). End is exclusive.
  # Winter was planned as 10–20 Nov 2024, but the OpenAQ archive holds no CPCB/DPCC
  # files for Nov 2024 (checked 2026-11-06: 1 of 55 monitors); Nov 2025 has 47 complete.
  winter:
    start: "2025-11-10"
    end: "2025-11-20"
  spring:
    start: "2025-03-01"
    end: "2025-03-11"

data:
  pollutant: pm25
  units: "µg/m³"
  timezone: Asia/Kolkata
  # Physically plausible hourly PM2.5 range (µg/m³). Values outside are treated as invalid.
  valid_min: 0.0
  valid_max: 2000.0
  # A sensor reporting the same value for at least this many consecutive hours is flagged as stuck.
  flatline_hours: 6
  # Stations with less than this fraction of valid hours in a window are dropped.
  min_coverage: 0.75

split:
  # Fractions of stations (not observations) for train / validation / test.
  train: 0.70
  val: 0.15
  test: 0.15

physics:
  # Removal (deposition) coefficient λ (1/s) — literature-informed, fixed; varied in sensitivity analysis.
  lam: 5.0e-6
  # Prior range for the learnable eddy diffusivity D (m²/s).
  D_min: 10.0
  D_max: 2000.0
  D_init: 300.0
  # Mixing height floor (m) — ERA5 reports values down to ~10 m on calm nights,
  # which would make S = E/H singular; 50 m is a typical lower bound of a nocturnal urban layer.
  H_min: 50.0
  H_ref: 500.0

twin:
  # SYNTHETIC experiment: truth generated by src/physics/solver.py with the parameters below,
  # driven by the real ERA5 winter forcing, sampled at station locations.
  start: "2024-11-12T00:00Z"
  days: 3
  spinup_hours: 24
  grid_km: 1.0
  D_true: 300.0
  lam_true: 5.0e-6
  C_inflow: 60.0          # µg/m³ regional background on inflow boundaries
  E_background: 0.4       # µg m⁻² s⁻¹ city-wide emission flux
  hotspots:               # [x_km, y_km, sigma_km, peak flux µg m⁻² s⁻¹] — illustrative, not an inventory
    - [8.0, 2.0, 4.0, 1.5]
    - [-15.0, 10.0, 5.0, 1.2]
    - [-2.0, -8.0, 3.0, 1.0]
  noise_rel: 0.05         # multiplicative Gaussian observation noise
  placeholder_stations: 36
